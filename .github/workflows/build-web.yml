name: build v2rayN.WebAPI

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ''
      publish_release:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example 7.x.y). Empty builds a development API package.'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish the validated packages as a GitHub Release in Nozilla-X/v2rayN.'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the published GitHub Release as a prerelease.'
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [master]
    paths:
      - 'v2rayN/v2rayN.WebAPI/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'v2rayN/v2rayN.slnx'
      - 'global.json'
      - '.github/workflows/build-web.yml'
      - '.github/workflows/release-web.yml'
      - '.github/workflows/build-all.yml'
      - '.github/workflows/upload-sign.yml'
  push:
    branches: [master]
    paths:
      - 'v2rayN/v2rayN.WebAPI/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'v2rayN/v2rayN.slnx'
      - 'global.json'
      - '.github/workflows/build-web.yml'
      - '.github/workflows/release-web.yml'
      - '.github/workflows/build-all.yml'
      - '.github/workflows/upload-sign.yml'
permissions:
  contents: read

jobs:
  identity:
    name: Resolve API build identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
      build_date: ${{ steps.resolve.outputs.build_date }}
    steps:
      - name: Resolve release identity
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ -z "$RELEASE_TAG" ]]; then
            {
              echo "version=0.0.0-dev"
              echo "tag="
              echo "release=false"
              echo "build_date=$build_date"
            } >> "$GITHUB_OUTPUT"
          else
            [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
            }
            {
              echo "version=$RELEASE_TAG"
              echo "tag=$RELEASE_TAG"
              echo "release=true"
              echo "build_date=$build_date"
            } >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Backend, ServiceLib, package smoke
    runs-on: ubuntu-24.04
    env:
      TUNIT_MAX_PARALLEL_TESTS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Verify API build, backend and ServiceLib tests, native startup and package boundaries
        run: bash v2rayN/v2rayN.WebAPI/Scripts/verify.sh "$RUNNER_TEMP/v2rayN.WebAPI-verify"
      - name: Check patch whitespace
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            empty_tree="$(git hash-object -t tree -w /dev/null)"
            git diff --check "$empty_tree" HEAD
          else
            git diff --check "$BASE_SHA...HEAD"
          fi

  windows:
    name: Windows WebAPI build and runtime smoke
    needs: identity
    runs-on: windows-latest
    env:
      TUNIT_MAX_PARALLEL_TESTS: 1
      WEB_VERSION: ${{ needs.identity.outputs.version }}
      WEB_COMMIT: ${{ github.sha }}
      WEB_BUILD_DATE: ${{ needs.identity.outputs.build_date }}
      WEB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Restore WebAPI
        shell: pwsh
        run: dotnet restore v2rayN/v2rayN.WebAPI/v2rayN.WebAPI.csproj
      - name: Restore WebAPI.Tests
        shell: pwsh
        run: dotnet restore v2rayN/v2rayN.WebAPI/Tests/v2rayN.WebAPI.Tests.csproj
      - name: Restore ServiceLib.Tests
        shell: pwsh
        run: dotnet restore v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj
      - name: Build WebAPI
        shell: pwsh
        run: dotnet build v2rayN/v2rayN.WebAPI/v2rayN.WebAPI.csproj --configuration Release --no-restore
      - name: Run WebAPI.Tests
        shell: pwsh
        run: dotnet test --project v2rayN/v2rayN.WebAPI/Tests/v2rayN.WebAPI.Tests.csproj --configuration Release --no-restore
      - name: Run ServiceLib.Tests
        shell: pwsh
        run: dotnet test --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj --configuration Release --no-restore
      - name: Publish win-x64 self-contained single-file WebAPI
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64'
          dotnet publish v2rayN/v2rayN.WebAPI/v2rayN.WebAPI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:WebVersion=$env:WEB_VERSION `
            -p:WebCommit=$env:WEB_COMMIT `
            -p:WebBuildDate=$env:WEB_BUILD_DATE `
            -p:WebRepository=$env:WEB_REPOSITORY `
            --output $publishDirectory
          $identity = [ordered]@{
            product = 'v2rayN.WebAPI'
            version = $env:WEB_VERSION
            commit = $env:WEB_COMMIT
            buildDate = $env:WEB_BUILD_DATE
            rid = 'win-x64'
          }
          $json = $identity | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $publishDirectory 'v2rayN.WebAPI.build.json'), $json, [Text.UTF8Encoding]::new($false))
      - name: Verify single-file publish output
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64'
          $executable = Join-Path $publishDirectory 'v2rayN.WebAPI.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "dotnet publish did not produce $executable"
          }
          if ((Get-Item -LiteralPath $executable).Length -eq 0) {
            throw "Published executable is empty: $executable"
          }
          $looseDlls = @(Get-ChildItem -LiteralPath $publishDirectory -Filter '*.dll' -File -Recurse)
          if ($looseDlls.Count -gt 0) {
            throw "Single-file publish left loose DLLs: $($looseDlls.FullName -join ', ')"
          }
      - name: Smoke-test first startup, health endpoint and graceful shutdown
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64'
          & ./v2rayN/v2rayN.WebAPI/Scripts/Test-Windows.ps1 -PublishDirectory $publishDirectory
      - name: Publish previous Windows fixture for update regression
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64-previous'
          dotnet publish v2rayN/v2rayN.WebAPI/v2rayN.WebAPI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:WebVersion=0.0.1-regression `
            -p:WebCommit=$env:WEB_COMMIT `
            -p:WebBuildDate=$env:WEB_BUILD_DATE `
            -p:WebRepository=$env:WEB_REPOSITORY `
            --output $publishDirectory
          $identity = [ordered]@{
            product = 'v2rayN.WebAPI'
            version = '0.0.1-regression'
            commit = $env:WEB_COMMIT
            buildDate = $env:WEB_BUILD_DATE
            rid = 'win-x64'
          }
          $json = $identity | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $publishDirectory 'v2rayN.WebAPI.build.json'), $json, [Text.UTF8Encoding]::new($false))
      - name: Add the matching Windows Core bundle
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'v2rayN-windows-64.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'v2rayN-windows-64-core'
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64'
          $previousDirectory = Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64-previous'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/2dust/v2rayN-core-bin/refs/heads/master/v2rayN-windows-64.zip' -OutFile $bundle
          Expand-Archive -LiteralPath $bundle -DestinationPath $expanded -Force
          $sourceBin = Join-Path $expanded 'v2rayN-windows-64\bin'
          if (-not (Test-Path -LiteralPath $sourceBin -PathType Container)) {
            throw "Windows Core bundle is missing $sourceBin"
          }
          foreach ($directory in @($publishDirectory, $previousDirectory)) {
            $destinationBin = Join-Path $directory 'bin'
            New-Item -ItemType Directory -Path $destinationBin -Force | Out-Null
            Copy-Item -Path (Join-Path $sourceBin '*') -Destination $destinationBin -Recurse -Force
          }
          foreach ($directory in @($publishDirectory, $previousDirectory)) {
            $checkBin = Join-Path $directory 'bin'
            foreach ($relative in @('xray\xray.exe','sing_box\sing-box.exe','mihomo\mihomo.exe','geoip.dat','geosite.dat','geoip.metadb','Country.mmdb')) {
              $required = Join-Path $checkBin $relative
              if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing Windows Core asset: $required" }
            }
          }
          $candidateBin = Join-Path $publishDirectory 'bin'
          & (Join-Path $candidateBin 'xray\xray.exe') -version
          if ($LASTEXITCODE -ne 0) { throw "xray.exe smoke failed: $LASTEXITCODE" }
          & (Join-Path $candidateBin 'sing_box\sing-box.exe') version
          if ($LASTEXITCODE -ne 0) { throw "sing-box.exe smoke failed: $LASTEXITCODE" }
          & (Join-Path $candidateBin 'mihomo\mihomo.exe') -v
          if ($LASTEXITCODE -ne 0) { throw "mihomo.exe smoke failed: $LASTEXITCODE" }
      - name: Smoke-test Windows self-update replacement and rollback
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          & ./v2rayN/v2rayN.WebAPI/Scripts/Test-WindowsUpdate.ps1 `
            -PreviousPublishDirectory (Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64-previous') `
            -CandidatePublishDirectory (Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64')
      - name: Package and smoke-test Windows full-install and app-only ZIPs
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64'
          $dist = Join-Path $env:RUNNER_TEMP 'v2rayN.WebAPI-win-x64-dist'
          python v2rayN/v2rayN.WebAPI/Scripts/web-release-assets.py package --rid win-x64 --publish $publishDirectory --dist $dist
          $fullZip = Join-Path $dist 'v2rayN-windows-64-web.zip'
          $appOnlyZip = Join-Path $dist 'v2rayN-windows-64-web-update.zip'
          if (-not (Test-Path -LiteralPath $fullZip -PathType Leaf) -or -not (Test-Path -LiteralPath $appOnlyZip -PathType Leaf)) {
            throw 'Windows release ZIPs were not created.'
          }
          $extracted = Join-Path $env:RUNNER_TEMP 'v2rayN-windows-64-web-smoke'
          Expand-Archive -LiteralPath $fullZip -DestinationPath $extracted -Force
          & ./v2rayN/v2rayN.WebAPI/Scripts/Test-Windows.ps1 -PublishDirectory $extracted
          "Windows full-install ZIP: $fullZip"
          "Windows app-only update ZIP: $appOnlyZip"
      - uses: actions/upload-artifact@v7
        if: inputs.release_tag != ''
        with:
          name: v2rayN.WebAPI-win-x64
          path: ${{ runner.temp }}/v2rayN.WebAPI-win-x64-dist/*.zip
          if-no-files-found: error

  native:
    name: Native API build (${{ matrix.rid }})
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        # Development builds keep x64 coverage; releases also validate ARM64.
        # Only tested Linux RIDs are enabled; native RID/runner pairs are independent
        # of Desktop workflows and the container platform matrix.
        include: >-
          ${{ fromJSON(needs.identity.outputs.release == 'true'
            && '[{"rid":"linux-x64","runner":"ubuntu-24.04"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"}]'
            || '[{"rid":"linux-x64","runner":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      RID: ${{ matrix.rid }}
      V2RAYN_WEB_VERSION: ${{ needs.identity.outputs.version }}
      V2RAYN_WEB_REPOSITORY: ${{ github.repository }}
      V2RAYN_WEB_COMMIT: ${{ github.sha }}
      V2RAYN_WEB_BUILD_DATE: ${{ needs.identity.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Publish native API
        run: bash v2rayN/v2rayN.WebAPI/Scripts/publish-native.sh "$RID"
      - name: Verify native executable
        run: test -x "v2rayN/v2rayN.WebAPI/publish/$RID/v2rayN.WebAPI"
      - name: Add the matching Linux Core bundle
        if: needs.identity.outputs.release == 'true'
        run: sh v2rayN/v2rayN.WebAPI/Scripts/fetch-core-bundle.sh "$RID" "v2rayN/v2rayN.WebAPI/publish/$RID/bin"
      - name: Package API install and self-update ZIPs
        if: needs.identity.outputs.release == 'true'
        run: bash v2rayN/v2rayN.WebAPI/Scripts/package-native.sh "$RID" "v2rayN/v2rayN.WebAPI/publish/$RID" dist
      - name: Smoke-test bundled Cores
        if: needs.identity.outputs.release == 'true'
        run: |
          set -euo pipefail
          publish="v2rayN/v2rayN.WebAPI/publish/$RID"
          "$publish/bin/xray/xray" -version
          "$publish/bin/sing_box/sing-box" version
          "$publish/bin/mihomo/mihomo" -v
      - uses: actions/upload-artifact@v7
        if: needs.identity.outputs.release == 'true'
        with:
          name: v2rayN.WebAPI-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  container:
    name: API Containerfile (${{ matrix.rid }})
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        # Development builds keep amd64 coverage; releases also validate ARM64.
        include: >-
          ${{ fromJSON(needs.identity.outputs.release == 'true'
            && '[{"rid":"linux-x64","platform":"linux/amd64"},{"rid":"linux-arm64","platform":"linux/arm64"}]'
            || '[{"rid":"linux-x64","platform":"linux/amd64"}]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build API container (no push)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./v2rayN/v2rayN.WebAPI/Containerfile
          platforms: ${{ matrix.platform }}
          tags: v2rayn-web-api:ci
          build-args: |
            RID=${{ matrix.rid }}
            WEB_VERSION=${{ needs.identity.outputs.version }}
            WEB_REPOSITORY=${{ github.repository }}
            WEB_COMMIT=${{ github.sha }}
            WEB_BUILD_DATE=${{ needs.identity.outputs.build_date }}
          push: false

  release-assets:
    name: Assemble API release assets
    if: needs.identity.outputs.release == 'true'
    needs: [identity, verify, windows, native, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: v2rayN.WebAPI-*
          path: release-assets
          merge-multiple: true
      - name: Build and verify web-update.json
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          python3 v2rayN/v2rayN.WebAPI/Scripts/web-update-manifest.py write \
            --version "$RELEASE_TAG" \
            --repository "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --build-date "${{ needs.identity.outputs.build_date }}" \
            --dist release-assets \
            --output release-assets/web-update.json
          python3 v2rayN/v2rayN.WebAPI/Scripts/web-update-manifest.py verify \
            --manifest release-assets/web-update.json \
            --dist release-assets \
            --repository "${{ github.repository }}"
      - name: Smoke-test full API ZIP
        run: bash v2rayN/v2rayN.WebAPI/Scripts/test-full-zip-runtime.sh release-assets/v2rayN-linux-64-web.zip
      - uses: actions/upload-artifact@v7
        with:
          name: web-release-packages
          path: release-assets/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: web-release-manifest
          path: release-assets/web-update.json
          if-no-files-found: error

  publish-fork-release:
    name: Publish fork GitHub Release
    if: inputs.publish_release && github.event_name == 'workflow_dispatch' && github.repository == 'Nozilla-X/v2rayN'
    needs: [identity, release-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: web-release-*
          path: release-assets
          merge-multiple: true
      - name: Re-verify all release assets
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          expected=(
            v2rayN-linux-64-web.zip
            v2rayN-linux-arm64-web.zip
            v2rayN-linux-64-web-update.zip
            v2rayN-linux-arm64-web-update.zip
            v2rayN-windows-64-web.zip
            v2rayN-windows-64-web-update.zip
            web-update.json
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          python3 v2rayN/v2rayN.WebAPI/Scripts/web-update-manifest.py verify \
            --manifest release-assets/web-update.json \
            --dist release-assets \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_TAG"
      - name: Create the release without replacing an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Git tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          assets=(
            release-assets/v2rayN-linux-64-web.zip
            release-assets/v2rayN-linux-arm64-web.zip
            release-assets/v2rayN-linux-64-web-update.zip
            release-assets/v2rayN-linux-arm64-web-update.zip
            release-assets/v2rayN-windows-64-web.zip
            release-assets/v2rayN-windows-64-web-update.zip
            release-assets/web-update.json
          )
          arguments=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --notes "v2rayN.WebAPI $RELEASE_TAG. Includes Linux x64/ARM64 and Windows x64 full-install and self-update packages."
          )
          if [[ "$PRERELEASE" == "true" ]]; then arguments+=(--prerelease); fi
          gh release create "${arguments[@]}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets \
            --jq '{url, isPrerelease, assets: [.assets[].name]}'
